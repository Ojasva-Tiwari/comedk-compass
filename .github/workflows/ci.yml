name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests & Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: comedk_compass_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Alembic migrations against fresh database
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/comedk_compass_test
        run: |
          alembic upgrade head

      - name: Load deterministic baseline seed fixture
        run: |
          python backend/tests/fixtures/load_seed.py "postgresql://postgres:postgrespassword@localhost:5432/comedk_compass_test"

      - name: Run Pytest test suite
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/comedk_compass_test
          APP_ENV: test
        run: |
          pytest backend/tests -q

  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun 1.2.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.2

      - name: Install dependencies (frozen lockfile)
        run: |
          bun install --frozen-lockfile

      - name: Run frontend tests
        run: |
          bun test

      - name: Build frontend production bundle
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: |
          bun run build
